const T=[...document.querySelectorAll('#app nav a,#app h1,#app h2,#app h3,#app .hero p,#app .card,#app .tag,#app .btn,#app .term,#app .sk,#app summary,#app .fl,#app footer')].map(e=>{const r=e.getBoundingClientRect();return{x:r.left,y:r.top,w:r.width,h:r.height,k:e.matches('h1,h2,h3,p,.tag,.btn,nav a,summary,footer')?0:1,fx:!!e.closest('nav'),p:0,a:0}}).filter(t=>t.w>8&&t.h>8).sort((a,b)=>a.y-b.y).slice(0,260);
const cv=document.createElement('canvas');cv.dataset.gen=1;cv.style.cssText='position:fixed;inset:0;z-index:55;width:100%;height:100%;pointer-events:none';document.body.append(cv);
const dpr=Math.min(devicePixelRatio||1,2),W=innerWidth,H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;const x=cv.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);
const hud=document.createElement('div');hud.id='hud';hud.dataset.gen=1;hud.innerHTML='<span id="hs"></span><button id="h1">1x</button><button id="hp">Pause</button><button id="hm"></button><button id="hx">Skip</button>';document.body.append(hud);
let sp=1,paused=false,snd=!auto,done=0,fin=0,lastU=0,quiet=performance.now(),last=performance.now(),raf;
if(!auto){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}
const beep=(f,d,v,ty)=>{if(!snd||!ac)return;const o=ac.createOscillator(),g=ac.createGain(),n=ac.currentTime;o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.0001,n+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(n+d)};
const nC=W<700?4:12,cs=[];for(let i=0;i<nC;i++)cs.push({x:Math.random()*W,y:H+20,c:`hsl(${[0,350,10,190,340,20][i%6]} 90% ${55+(i%3)*6}%)`,n:'Agent-'+(i+1),t:null,m:0,d:1,s:0});
const bz=(a,b,c,d,t)=>{const u=1-t;return u*u*u*a+3*u*u*t*b+3*u*t*t*c+t*t*t*d};
const sy=t=>t.fx?t.y:t.y-scrollY,vis=t=>{const y=sy(t);return y+t.h>0&&y<H};
const upd=()=>{$('#hs').textContent=`${nC} agents | ${done}/${T.length} layers`;$('#h1').textContent=sp+'x';$('#hm').textContent=snd?'Sound on':'Sound off'};
const usr=()=>{lastU=performance.now()};
const end=()=>{cancelAnimationFrame(raf);cv.remove();hud.remove();root.style.scrollBehavior='';removeEventListener('keydown',esc2);removeEventListener('resize',end);removeEventListener('wheel',usr);removeEventListener('touchmove',usr);sw=null};
const esc2=e=>{if(e.key=='Escape')end()};addEventListener('keydown',esc2);addEventListener('resize',end);addEventListener('wheel',usr,{passive:true});addEventListener('touchmove',usr,{passive:true});
hud.addEventListener('click',e=>{const id=e.target.id;if(id=='h1')sp=sp%3+1;if(id=='hp'){paused=!paused;e.target.textContent=paused?'Play':'Pause'}if(id=='hm'){snd=!snd;if(snd&&!ac)try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(x){}}if(id=='hx')end();upd()});
sw={end};upd();
function frame(now){const dt=paused?0:Math.min(now-last,50)*sp;last=now;
const open=T.filter(t=>t.p<1),pend=open.find(vis);if(pend)quiet=now;
if(!paused&&open.length&&!pend&&now-quiet>500&&now-lastU>1200){const goal=Math.max(0,Math.min(open[0].y-H*.3,document.documentElement.scrollHeight-H));scrollTo({top:scrollY+(goal-scrollY)*Math.min(1,dt/220)+Math.sign(goal-scrollY)*Math.min(1,Math.abs(goal-scrollY)),behavior:'instant'})}
cs.forEach(c=>{if(!c.t){const t=T.find(t=>!t.a&&vis(t));if(!t)return;t.a=1;c.t=t;c.s=0;c.m=0;c.d=600+Math.random()*500;c.a={x:c.x,y:c.y};c.b={x:c.x+(Math.random()-.5)*400,y:c.y-100-Math.random()*200};c.e={x:t.x+(Math.random()-.5)*300,y:sy(t)+(Math.random()-.5)*200}}
const t=c.t,ty=sy(t);if(c.s==0){c.m+=dt/c.d;const e=ease(Math.min(c.m,1));c.x=bz(c.a.x,c.b.x,c.e.x,t.x,e);c.y=bz(c.a.y,c.b.y,c.e.y,ty,e);if(c.m>=1)c.s=1}
else{const q=Math.floor(t.p*(t.k?8:t.w/6));t.p=Math.min(1,t.p+dt/(t.k?650:180+t.w*2.2));if(Math.floor(t.p*(t.k?8:t.w/6))!=q&&!t.k)beep(1500+Math.random()*700,.03,.035,'square');
c.x=t.x+t.w*t.p;c.y=t.k?ty+t.h*t.p:ty+t.h;if(t.p>=1){beep(90,.25,.18,'sine');done++;c.t=null;upd()}}});
x.clearRect(0,0,W,H);x.fillStyle='rgba(5,5,7,.96)';x.fillRect(0,0,W,H);
T.forEach(t=>{if(t.p>0&&vis(t))x.clearRect(t.x,sy(t),t.w*t.p,t.k?t.h*t.p:t.h)});
x.font='11px JetBrains Mono,monospace';
T.forEach((t,i)=>{if(t.p>0&&t.p<1&&vis(t)){const w=t.w*t.p,h=t.k?t.h*t.p:t.h,col=i%2?'#22d3ee':'#ef4444',y=sy(t);x.strokeStyle=col;x.lineWidth=1;x.strokeRect(t.x+.5,y+.5,w,h);x.fillStyle=col;x.fillText(`${w|0} × ${h|0}`,t.x,y-5);[[0,0],[w,0],[0,h],[w,h]].forEach(([a,b])=>x.fillRect(t.x+a-3,y+b-3,6,6));if(!t.k&&(now/300|0)%2){x.fillStyle='#fff';x.fillRect(t.x+w,y,2,t.h)}}});
cs.forEach(c=>{x.save();x.translate(c.x,c.y);x.fillStyle=c.c;x.beginPath();x.moveTo(0,0);x.lineTo(0,16);x.lineTo(4,12);x.lineTo(8,19);x.lineTo(11,18);x.lineTo(7,11);x.lineTo(12,11);x.closePath();x.fill();x.font='11px Space Grotesk,sans-serif';const w=x.measureText(c.n).width+10;x.fillRect(12,14,w,16);x.fillStyle='#fff';x.fillText(c.n,17,26);x.restore()});
if(done>=T.length){fin+=dt;if(fin>900)return end()}
raf=requestAnimationFrame(frame)}
raf=requestAnimationFrame(frame)}
addEventListener('keydown',e=>{if(e.altKey&&e.shiftKey&&e.code=='KeyS'){e.preventDefault();sw?sw.end():swarm()}});
/* ---------- Owner mode (only the account that owns this page) ---------- */
function mark(){const b=$('#sv');if(b)b.textContent=dirty?`Save & publish (${dirty})`:'Save & publish'}
function build(){const c=document.documentElement.cloneNode(true);c.querySelector('#app').innerHTML='';c.querySelectorAll('[data-gen]').forEach(n=>n.remove());c.querySelector('#state').textContent=JSON.stringify(S).replace(/</g,'\\u003c');['data-theme','style'].forEach(a=>c.removeAttribute(a));c.querySelector('body').removeAttribute('style');c.setAttribute('data-theme','obsidian');return '<!doctype html>\n'+c.outerHTML}
function ownerUI(){owner=true;render();
const d=document.createElement('aside');d.id='drawer';d.dataset.gen=1;d.innerHTML=`<h3 style="margin:0">Owner panel</h3><small>Only you see this. Changes go live for everyone when you save.</small>
<h4>Add skill</h4><input id="sn" placeholder="Skill name"><select id="sl"><option value="1">Learning</option><option value="2">Confident</option><option value="3">Mastered</option></select><button class="btn" data-add="skills">Add skill</button>
<h4>Add certificate or badge</h4><input id="cg" placeholder="Group (e.g. Generative AI & agents)"><input id="ct" placeholder="Title"><input id="cu" placeholder="Certificate link (https://…)"><button class="btn" data-add="certs">Add certificate</button>
<h4>Add project</h4><input id="pt" placeholder="Title"><textarea id="pd" rows="3" placeholder="What it does"></textarea><input id="pg" placeholder="Tags, comma separated"><input id="ph" placeholder="GitHub link"><input id="pl" placeholder="Live demo link"><button class="btn" data-add="projects">Add project</button>
<h4>Contact email</h4><input id="em" type="email" placeholder="you@example.com" value="${esc(S.email)}"><button class="btn" data-add="email">Set email</button>
<p><small>Use the × buttons on the page to remove items.</small></p>
<div style="position:sticky;bottom:0;padding-top:12px"><button class="btn p" id="sv" style="width:100%">Save & publish</button></div>`;
document.body.append(d);const f=document.createElement('div');f.className='fab';f.dataset.gen=1;f.innerHTML='<button aria-label="Open owner panel" title="Owner panel">⚙</button>';document.body.append(f);
f.firstChild.onclick=()=>d.classList.toggle('open');
d.addEventListener('click',async e=>{const a=e.target.dataset.add;
if(a){const v=id=>$('#'+id).value.trim();
if(a=='skills'&&v('sn'))S.skills.push({n:v('sn'),l:+v('sl')});
else if(a=='certs'&&v('ct'))S.certs.push({g:v('cg')||'Other',t:v('ct'),u:url(v('cu'))});
else if(a=='projects'&&v('pt'))S.projects.push({t:v('pt'),d:v('pd'),tags:v('pg').split(',').map(s=>s.trim()).filter(Boolean),gh:url(v('ph')),live:url(v('pl'))});
else if(a=='email')S.email=v('em');else return toast('Fill in the main field first.');
dirty++;render();mark();d.querySelectorAll('input:not(#em),textarea').forEach(i=>i.value='');toast('Added. Press Save & publish to go live.')}
if(e.target.id=='sv'){if(!artifact)return toast('Publishing isn’t available in this view.');try{await artifact.publish(build())}catch(x){toast('Couldn’t publish: '+(x&&x.code||'try again'))}}})}
render();bgfx();
(async()=>{try{const u=await claude.use('user');artifact=await claude.use('artifact');if(u&&u.isOwner())ownerUI()}catch(e){}})();
try{if(!matchMedia('(prefers-reduced-motion:reduce)').matches&&!sessionStorage.getItem('sw')){sessionStorage.setItem('sw','1');setTimeout(()=>swarm(true),700)}}catch(e){}
</script>
