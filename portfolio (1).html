<!doctype html>
<html lang="en" data-theme="obsidian">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Abhinav Khedwal – AI/ML & Cloud Developer</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#09090b;--sf:#121215;--bd:#27272a;--pr:#dc2626;--pr2:#ef4444;--tx:#f4f4f5;--mu:#a1a1aa;--gl:rgba(220,38,38,.15);--sh:none;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
html[data-theme=neon]{--bg:#000;--sf:#050507;--bd:#ff003d;--pr:#ff003d;--pr2:#ff3366;--gl:rgba(255,0,61,.2);--sh:0 0 15px rgba(255,0,61,.5)}
html[data-theme=stealth]{--bg:#050505;--sf:#0b0b0c;--bd:#3f3f46;--pr:#9f1d1d;--pr2:#b91c1c;--gl:rgba(159,29,29,.12)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 'Space Grotesk',system-ui,sans-serif}
html[data-theme=neon] body{background-image:linear-gradient(rgba(255,0,61,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(255,0,61,.07) 1px,transparent 1px);background-size:44px 44px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
a{color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--bd)}
nav .wrap{display:flex;align-items:center;gap:18px;height:56px;overflow-x:auto}
nav b{margin-right:auto;white-space:nowrap}
nav a{text-decoration:none;color:var(--mu);font-size:14px;white-space:nowrap}
nav a:hover{color:var(--pr2)}
.dots{display:flex;gap:8px}
.dots button{width:18px;height:18px;border-radius:50%;border:2px solid var(--bd);cursor:pointer;padding:0}
.dots [data-t=obsidian]{background:#dc2626}.dots [data-t=neon]{background:#000;border-color:#ff003d;box-shadow:0 0 8px #ff003d}.dots [data-t=stealth]{background:#3f3f46}
section{padding:72px 0 8px}
#app{position:relative;z-index:1}
#bg{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse 80% 45% at 50% -8%,color-mix(in srgb,var(--pr) 7%,transparent),transparent 70%),radial-gradient(circle,color-mix(in srgb,var(--tx) 13%,transparent) 1px,transparent 1.4px);background-size:100% 100%,28px 28px}
html[data-theme=neon] #bg{opacity:.4}
#rail{position:fixed;right:12px;top:50%;transform:translateY(-50%);z-index:25;height:140px;width:2px;background:var(--bd)}
#rail i{display:block;width:100%;background:var(--pr);box-shadow:var(--sh)}
#rail b{position:absolute;right:8px;top:-24px;font:600 11px 'JetBrains Mono',monospace;color:var(--mu)}
@media (max-width:700px){#rail{display:none}}
h2::before{content:attr(data-n);display:block;font:600 12px 'JetBrains Mono',monospace;letter-spacing:.18em;color:var(--pr2);margin-bottom:6px}
.card::before,.card::after{content:"";position:absolute;width:12px;height:12px;border:2px solid var(--pr);opacity:.75;transition:width .2s,height .2s;pointer-events:none}
.card::before{top:-1px;left:-1px;border-right:0;border-bottom:0;border-top-left-radius:12px}
.card::after{bottom:-1px;right:-1px;border-left:0;border-top:0;border-bottom-right-radius:12px}
.card:hover::before,.card:hover::after{width:28px;height:28px}
h1{font-size:clamp(40px,8vw,84px);line-height:1.02;margin:0 0 14px;letter-spacing:-.03em;background:linear-gradient(100deg,var(--tx) 0%,var(--pr2) 28%,var(--tx) 50%,var(--pr) 72%,var(--tx) 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shim 6s linear infinite;filter:drop-shadow(0 0 22px var(--gl))}
@keyframes shim{to{background-position:-250% 0}}
h2::after{content:"";display:block;width:56px;height:3px;margin-top:8px;background:var(--pr);box-shadow:var(--sh);animation:bar 3.5s ease-in-out infinite}
@keyframes bar{50%{width:130px}}
nav b{animation:gw 2.5s ease-in-out infinite}
@keyframes gw{50%{text-shadow:0 0 14px var(--pr2);color:var(--pr2)}}
.btn.p{animation:pl 3s ease-in-out infinite}
@keyframes pl{50%{box-shadow:0 0 22px color-mix(in srgb,var(--pr) 65%,transparent)}}
h2{font-size:clamp(26px,4vw,38px);margin:0 0 22px;letter-spacing:-.02em}
.hero{padding-top:84px}
.photo{margin:0 0 28px;position:relative;aspect-ratio:4/5;max-width:260px;border-radius:16px;border:1px solid var(--bd);background:#0f0f0f}
.photo img{width:100%;height:100%;object-fit:cover;border-radius:15px;display:block}
.photo::before,.photo::after{content:"";position:absolute;width:26px;height:26px;border:2px solid var(--pr);pointer-events:none;box-shadow:var(--sh)}
.photo::before{top:-6px;left:-6px;border-right:0;border-bottom:0;border-top-left-radius:16px}
.photo::after{bottom:-6px;right:-6px;border-left:0;border-top:0;border-bottom-right-radius:16px}
@media (min-width:761px){.hero{display:grid;grid-template-columns:minmax(240px,320px) 1fr;gap:56px;align-items:center}.photo{margin:0;max-width:none}}
.hero p{color:var(--mu);max-width:56ch;margin:0 0 22px}
.type{font:600 clamp(16px,2.4vw,22px) 'JetBrains Mono',monospace;color:var(--pr2);min-height:1.6em;margin-bottom:18px}
.type::after{content:"▌";animation:bl 1s steps(2) infinite}
@keyframes bl{50%{opacity:0}}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{display:inline-block;padding:10px 18px;border:1px solid var(--bd);border-radius:8px;background:var(--sf);color:var(--tx);text-decoration:none;font:600 14px inherit;font-family:inherit;cursor:pointer}
.btn:hover,.btn:focus-visible{border-color:var(--pr);box-shadow:var(--sh)}
.btn.p{background:var(--pr);border-color:var(--pr);color:#fff}
:focus-visible{outline:2px solid var(--pr2);outline-offset:2px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:20px;position:relative;transition:transform .2s,border-color .2s,box-shadow .2s}
.card:hover{transform:scale(1.02);border-color:var(--pr);box-shadow:0 0 0 1px var(--pr),0 8px 40px var(--gl)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.card h3{margin:0 0 8px;font-size:20px}.card p{margin:0 0 14px;color:var(--mu);font-size:15px}
.tag{display:inline-block;padding:2px 10px;margin:0 6px 6px 0;border-radius:99px;background:var(--gl);border:1px solid var(--bd);font-size:12.5px;color:var(--pr2)}
.term{background:#000;border:1px solid var(--bd);border-radius:12px;overflow:hidden;font:14px/1.7 'JetBrains Mono',monospace}
.tabs{display:flex;background:var(--sf);border-bottom:1px solid var(--bd)}
.tabs button{background:none;border:0;color:var(--mu);padding:10px 16px;font:inherit;cursor:pointer}
.tabs button[aria-selected=true]{color:var(--pr2);box-shadow:inset 0 -2px var(--pr)}
.tb{padding:16px 18px;min-height:190px;white-space:pre-wrap}
.tb .g{color:var(--pr2)}
.sk{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;margin:0 8px 8px 0;border:1px solid var(--bd);border-radius:8px;background:var(--sf)}
.sk i{display:flex;gap:3px}.sk i s{width:7px;height:7px;border-radius:50%;background:var(--bd)}.sk i s.on{background:var(--pr2)}
.sk small{color:var(--mu)}
details{border:1px solid var(--bd);border-radius:10px;background:var(--sf);margin-bottom:10px;padding:2px 16px}
summary{cursor:pointer;padding:12px 0;font-weight:600}
details li{color:var(--mu);margin:6px 0}
details li a{color:var(--pr2)}
.tl{border-left:2px solid var(--bd);margin-left:8px;padding-left:22px}
.tl details{position:relative}
.tl details::before{content:"";position:absolute;left:-30px;top:18px;width:12px;height:12px;border-radius:50%;background:var(--pr);box-shadow:0 0 0 4px var(--bg),var(--sh)}
form.glass{background:rgba(255,255,255,.04);backdrop-filter:blur(14px);border:1px solid var(--bd);border-radius:14px;padding:22px;display:grid;gap:18px;max-width:560px}
.fl{position:relative}
.fl input,.fl textarea{width:100%;padding:20px 12px 8px;background:rgba(0,0,0,.4);border:1px solid var(--bd);border-radius:8px;color:var(--tx);font:inherit}
.fl input:focus,.fl textarea:focus{outline:0;border-color:var(--pr);box-shadow:0 0 12px var(--gl),var(--sh)}
.fl label{position:absolute;left:12px;top:13px;color:var(--mu);font-size:15px;pointer-events:none;transition:.15s}
.fl input:not(:placeholder-shown)+label,.fl input:focus+label,.fl textarea:not(:placeholder-shown)+label,.fl textarea:focus+label{top:3px;font-size:11.5px;color:var(--pr2)}
.fl.bad input,.fl.bad textarea{border-color:#f87171}.fl small{display:none;color:#f87171;font-size:12.5px}.fl.bad small{display:block}
footer{padding:48px 0 90px;color:var(--mu);font-size:14px}
.rm{position:absolute;top:8px;right:8px;background:#450a0a;color:#fff;border:1px solid var(--pr);border-radius:6px;cursor:pointer;font-size:13px;padding:0 8px}
.sk .rm{position:static;margin-left:4px}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));z-index:40;display:flex;gap:10px}
.fab button{width:48px;height:48px;border-radius:50%;border:1px solid var(--pr);background:var(--sf);color:var(--pr2);cursor:pointer;font-size:20px;box-shadow:var(--sh)}
#hud{position:fixed;left:50%;transform:translateX(-50%);bottom:max(16px,env(safe-area-inset-bottom,0px));z-index:60;display:flex;gap:10px;align-items:center;padding:8px 14px;background:#000d;border:1px solid var(--pr);border-radius:99px;font:13px 'JetBrains Mono',monospace;color:#fff;flex-wrap:wrap;justify-content:center;max-width:94vw}
#hud button{background:var(--sf);color:#fff;border:1px solid var(--bd);border-radius:6px;padding:3px 9px;cursor:pointer;font:inherit}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(400px,100%);z-index:50;background:var(--sf);border-left:1px solid var(--pr);padding:calc(20px + env(safe-area-inset-top,0px)) 18px 90px;overflow-y:auto;transform:translateX(105%);transition:transform .25s}
#drawer.open{transform:none}
#drawer h4{margin:22px 0 8px;color:var(--pr2)}
#drawer input,#drawer select,#drawer textarea{width:100%;margin:0 0 8px;padding:9px 10px;background:#000;border:1px solid var(--bd);border-radius:8px;color:var(--tx);font:inherit}
#toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);z-index:70;background:var(--pr);color:#fff;padding:8px 16px;border-radius:8px;display:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
</style>
